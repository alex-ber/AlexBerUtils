[project]
name = "alex-ber-utils"
version = "1.0.1"
requires-python = ">=3.10"
dynamic = [
    "description",
    "readme",
    "license",
    "authors",
    "keywords",
    "classifiers",
    "dependencies",
    "optional-dependencies",
    "urls",
]


[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "twine>=7.0.0",
]


#uv python pin 3.10